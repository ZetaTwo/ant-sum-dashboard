name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: dist/linux
      - uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: dist/windows
      - name: Package binaries
        run: |
          chmod +x dist/linux/ant-sum-dashboard
          mv dist/linux/ant-sum-dashboard dist/ant-sum-dashboard-${{ github.ref_name }}-linux-x86_64
          mv dist/windows/ant-sum-dashboard.exe dist/ant-sum-dashboard-${{ github.ref_name }}-windows-x86_64.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ant-sum-dashboard-${{ github.ref_name }}-linux-x86_64
            dist/ant-sum-dashboard-${{ github.ref_name }}-windows-x86_64.exe
          generate_release_notes: true
