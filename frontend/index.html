<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ANT+ Sum Dashboard</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <div id="status" class="status status--connecting">connecting…</div>
      <div id="set-distance" class="total">0 m</div>
      <div id="set-info" class="info"></div>
      <div class="session">
        <span class="session-label">Session</span>
        <span id="session-distance">0 m</span>
        <span id="session-info" class="info"></span>
      </div>
      <table id="devices">
        <thead>
          <tr>
            <th>Device</th>
            <th>Type</th>
            <th>Set</th>
            <th>Session</th>
          </tr>
        </thead>
        <tbody id="device-rows"></tbody>
      </table>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
